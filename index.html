<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroge Tera Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f3f4f6);
            color: var(--tg-theme-text-color, #1f2937);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6 border-b pb-3">
        <h1 class="text-2xl font-bold text-emerald-600">🛒 አሮጌ ተራ</h1>
        <span id="user-name" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full"></span>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b mb-4">
        <button id="btn-feed" onclick="switchTab('feed')" class="flex-1 py-2 text-center font-semibold border-b-2 border-emerald-600 text-emerald-600">
            የሚሸጡ እቃዎች
        </button>
        <button id="btn-post" onclick="switchTab('post')" class="flex-1 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent">
            ➕ እቃ ሸጥ
        </button>
    </div>

    <!-- TAB 1: Products Feed -->
    <div id="tab-feed">
        <div id="loading" class="text-center py-8 text-gray-500">እቃዎች በመጫን ላይ ናቸው...</div>
        <div id="products-list" class="grid grid-cols-1 gap-4 hidden"></div>
    </div>

    <!-- TAB 2: Post Product Form -->
    <div id="tab-post" class="hidden">
        <form id="product-form" onsubmit="submitProduct(event)" class="space-y-4 bg-white p-4 rounded-xl shadow-sm">
            <div>
                <label class="block text-sm font-medium mb-1">የእቃው ስም *</label>
                <input type="text" id="title" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="ምሳሌ፦ ሶፋ ወይም ስልክ">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">ዋጋ (በብር) *</label>
                <input type="number" id="price" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="1500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">ሁኔታ (Condition) *</label>
                <select id="condition" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="በጣም ጥሩ">በጣም ጥሩ</option>
                    <option value="ከፊል ያገለገለ">ከፊል ያገለገለ</option>
                    <option value="ጥገና የሚያስፈልገው">ጥገና የሚያስፈልገው</option>
                    <option value="አዲስ">አዲስ</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">የፎቶ URL (Link)</label>
                <input type="url" id="imageUrl" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="https://example.com/photo.jpg">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">ዝርዝር መግለጫ</label>
                <textarea id="description" rows="3" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="ስለ እቃው ተጨማሪ መረጃ..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition">
                ለሽያጭ ልጠፍ
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = "https://aroge-tera-used-corner-1.onrender.com";
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-name').innerText = user.first_name || 'ተጠቃሚ';
            }
        }

        function switchTab(tab) {
            const feedTab = document.getElementById('tab-feed');
            const postTab = document.getElementById('tab-post');
            const btnFeed = document.getElementById('btn-feed');
            const btnPost = document.getElementById('btn-post');

            if (tab === 'feed') {
                feedTab.classList.remove('hidden');
                postTab.classList.add('hidden');
                btnFeed.className = "flex-1 py-2 text-center font-semibold border-b-2 border-emerald-600 text-emerald-600";
                btnPost.className = "flex-1 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent";
                fetchProducts();
            } else {
                feedTab.classList.add('hidden');
                postTab.classList.remove('hidden');
                btnPost.className = "flex-1 py-2 text-center font-semibold border-b-2 border-emerald-600 text-emerald-600";
                btnFeed.className = "flex-1 py-2 text-center font-semibold text-gray-500 border-b-2 border-transparent";
            }
        }

        async function fetchProducts() {
            const loading = document.getElementById('loading');
            const list = document.getElementById('products-list');
            loading.classList.remove('hidden');
            list.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/products`);
                const products = await res.json();

                list.innerHTML = '';
                if (!products || products.length === 0) {
                    list.innerHTML = '<p class="text-center text-gray-500 py-8">ምንም የተለጠፈ እቃ የለም።</p>';
                } else {
                    products.forEach(item => {
                        const img = item.images && item.images.length > 0 ? item.images[0] : 'https://via.placeholder.com/300x200?text=No+Image';
                        const card = `
                            <div class="bg-white rounded-xl shadow-sm overflow-hidden border">
                                <img src="${img}" class="w-full h-48 object-cover" alt="${item.title}">
                                <div class="p-4">
                                    <div class="flex justify-between items-start">
                                        <h3 class="font-bold text-lg">${item.title}</h3>
                                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded">${item.condition}</span>
                                    </div>
                                    <p class="text-emerald-600 font-extrabold text-xl my-1">${item.price} ብር</p>
                                    <p class="text-gray-600 text-sm mb-3">${item.description || 'ምንም መግለጫ የለውም'}</p>
                                    <a href="https://t.me/${item.seller_telegram_id}" target="_blank" class="block text-center bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-2 rounded-lg text-sm border border-emerald-200">
                                        💬 ሻጭን ያናግሩ
                                    </a>
                                </div>
                            </div>
                        `;
                        list.innerHTML += card;
                    });
                }
            } catch (err) {
                list.innerHTML = '<p class="text-center text-red-500 py-8">እቃዎችን መጫን አልተቻለም።</p>';
            } finally {
                loading.classList.add('hidden');
                list.classList.remove('hidden');
            }
        }

        async function submitProduct(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "እየተለጠፈ ነው...";

            const user = tg?.initDataUnsafe?.user;
            const sellerId = user?.username || user?.id?.toString() || "guest_user";

            const imageUrl = document.getElementById('imageUrl').value;
            const payload = {
                title: document.getElementById('title').value,
                price: parseFloat(document.getElementById('price').value),
                condition: document.getElementById('condition').value,
                description: document.getElementById('description').value,
                images: imageUrl ? [imageUrl] : [],
                seller_telegram_id: sellerId
            };

            try {
                const res = await fetch(`${API_BASE_URL}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("እቃው በትክክል ተለጥፏል!");
                    document.getElementById('product-form').reset();
                    switchTab('feed');
                } else {
                    alert("ስህተት ተከስቷል! እባክዎ ድጋሚ ይሞክሩ።");
                }
            } catch (err) {
                alert("ከሰርቨር ጋር ማገናኘት አልተቻለም።");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "ለሽያጭ ልጠፍ";
            }
        }

        fetchProducts();
    </script>
</body>
</html>
